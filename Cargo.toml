[package]
name = "files_rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crossterm = "0.28"
dirs = "5.0"
glob = "0.3"
lofty = "0.22"
ratatui = "0.29"
rodio = "0.22"
serde = { version = "1.0", features = ["derive"] }
ssh2 = { version = "0.9", features = ["vendored-openssl"] }
toml = "0.8"
users = "0.11"

[target.'cfg(target_os = "linux")'.dependencies]
alsa-sys = "0.4"